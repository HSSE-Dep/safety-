<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قياس ثقافة السلامة - السعودية للطاقة</title>
<style>
  :root { --primary-color: #0066ff; --secondary-color: #00cc99; --bg-color: #f4f7f6; --card-bg: #ffffff; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; text-align: center; }
  .container { max-width: 650px; margin: auto; background: var(--card-bg); padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); margin-top: 40px; border-top: 5px solid var(--primary-color); }
  .logo { width: 220px; margin-bottom: 15px; } 
  h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px;}
  .subtitle { color: #7f8c8d; margin-bottom: 30px; }
  .msg-box { background: rgba(0, 102, 255, 0.05); color: var(--primary-color); padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; border: 1px solid rgba(0, 102, 255, 0.2); }
  .user-type-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; background: #ecf0f1; padding: 15px; border-radius: 8px; }
  input[type="text"], select { width: 85%; padding: 14px; margin: 10px 0; border: 1.5px solid #bdc3c7; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
  button { background-color: var(--primary-color); color: white; border: none; padding: 14px 24px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 85%; transition: 0.3s; }
  button:hover { background-color: #004ecc; }
  .option { display: block; background: #f8f9f9; padding: 18px; margin: 12px 0; border-radius: 8px; cursor: pointer; border: 2px solid #e5e8e8; text-align: right; }
  .option:hover { background: #eaeded; border-color: var(--primary-color); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container" id="login-page">
  <img src="logo.png" alt="الشعار" class="logo" onerror="this.style.display='none';">
  <h1>قواعد الحفاظ على الحياة</h1>
  <p class="subtitle">بوابة قياس ثقافة السلامة المهنية</p>
  
  <div class="user-type-container">
    <div><input type="radio" id="emp" name="userType" value="employee" checked onchange="toggleFields()"><label>🏢 موظف شركة</label></div>
    <div><input type="radio" id="cont" name="userType" value="contractor" onchange="toggleFields()"><label>👷 مقاول</label></div>
  </div>

  <select id="empRole">
    <option value="موظف اداري">موظف إداري</option>
    <option value="مدير">مدير</option>
    <option value="رئيس قسم">رئيس قسم</option>
    <option value="موظف ميداني">موظف ميداني</option>
  </select>

  <input type="text" id="companyId" placeholder="الرقم الوظيفي / الهوية">
  <input type="text" id="userName" placeholder="الاسم الرباعي">
  <button onclick="startApp()">ابدأ التقييم</button>
</div>

<div class="container hidden" id="quiz-page">
  <h2 id="questionText" style="text-align: right;"></h2>
  <div id="optionsList"></div>
</div>

<div class="container hidden" id="result-page">
  <h1 style="color: var(--secondary-color);">🏁 اكتمل قياس ثقافة السلامة</h1>
  <div class="msg-box" id="resultMsg"></div>
  <h3 id="resName"></h3>
  <h3 id="resScore"></h3>
  <button onclick="location.reload()">إعادة التقييم 🔄</button>
</div>

<script>
  const adminQuestions = [
    { q: "ما أول إجراء عند مشاهدة شخص فاقد للوعي؟", options: ["إعطاؤه ماء", "التأكد من سلامة الموقع وفحص الاستجابة", "نقله مباشرة", "الانتظار"], answer: 1 },
    { q: "عند وجود نزيف شديد؟", options: ["غسل الجرح", "الضغط المباشر", "ترك النزيف", "إزالة الجسم المغروس"], answer: 1 },
    { q: "ما رقم الإسعاف في السعودية؟", options: ["999", "911", "997", "الرقم الموحد للطوارئ"], answer: 3 },
    { q: "في حال الاشتباه بكسر بالعمود الفقري؟", options: ["مساعدة المصاب على الوقوف", "عدم تحريكه", "تدليك الإصابة", "إعطاؤه مسكن"], answer: 1 },
    { q: "هدف الإنعاش القلبي الرئوي (CPR)؟", options: ["تخفيف الألم", "المحافظة على تدفق الدم", "إيقاف النزيف", "علاج الكسر"], answer: 1 },
    { q: "ما أول خطوة عند اكتشاف حريق؟", options: ["محاولة إطفائه", "إطلاق الإنذار", "فتح الأبواب", "الانتظار"], answer: 1 },
    { q: "طفاية حرائق الأجهزة الكهربائية؟", options: ["الماء", "الرغوة", "ثاني أكسيد الكربون", "الماء المضغوط"], answer: 2 },
    { q: "ماذا تعني قاعدة PASS؟", options: ["سحب المسمار-توجيه-ضغط-تحريك", "حمل الطفاية", "رش الماء", "الإخلاء"], answer: 0 },
    { q: "عند اشتعال زيت الطبخ لا نستخدم؟", options: ["غطاء معدني", "طفاية مناسبة", "الماء", "بطانية الحريق"], answer: 2 },
    { q: "متى تتوقف عن إطفاء الحريق؟", options: ["إذا زاد الدخان أو خرج عن السيطرة", "بعد دقيقة", "بعد نصف طفاية", "لا توجد ضرورة"], answer: 0 }
  ];

  const fieldQuestions = [
    { q: "أهم وسيلة لحماية السائق؟", options: ["المكيف", "حزام الأمان", "الإذاعة", "فتح النوافذ"], answer: 1 },
    { q: "المسافة الآمنة بين المركبات؟", options: ["متران", "ثلاث ثوانٍ", "نصف متر", "حسب السرعة"], answer: 1 },
    { q: "استخدام الهاتف أثناء القيادة؟", options: ["يحسن التركيز", "يزيد مخاطر الحوادث", "لا يؤثر", "يقلل الاستجابة"], answer: 1 },
    { q: "عند الشعور بالنعاس؟", options: ["زيادة السرعة", "فتح النافذة", "التوقف والراحة", "شرب ماء"], answer: 2 },
    { q: "قبل تحريك المركبة تأكد من؟", options: ["الوقود", "سلامة المركبة والحزام", "الراديو", "تنظيف الزجاج"], answer: 1 },
    { q: "هدف تصريح العمل؟", options: ["زيادة الإنتاج", "ضمان التنفيذ بأمان", "تسجيل الحضور", "ساعات العمل"], answer: 1 },
    { q: "من المسؤول عن الالتزام بالتصريح؟", options: ["المشرف", "العامل", "جميع المشاركين", "الأمن"], answer: 2 },
    { q: "متى يصبح التصريح غير صالح؟", options: ["انتهاء المدة أو تغير الظروف", "انتهاء الاستراحة", "تغيير العامل", "بعد ساعة"], answer: 0 },
    { q: "هل يجوز البدء قبل التصريح؟", options: ["نعم", "نعم بموافقة الزملاء", "لا يجوز", "حسب المشرف"], answer: 2 },
    { q: "في حال تغير الموقع؟", options: ["الاستمرار", "إصدار تصريح جديد", "تجاهله", "إبلاغ الزملاء"], answer: 1 }
  ];

  let currentQ = 0, score = 0, questions = [];

  function toggleFields() {
    let isEmp = document.getElementById('emp').checked;
    document.getElementById('empRole').classList.toggle('hidden', !isEmp);
    document.getElementById('companyId').placeholder = isEmp ? "الرقم الوظيفي" : "رقم الهوية";
  }

  function startApp() {
    if(!document.getElementById('userName').value) return alert("الاسم مطلوب");
    let isEmp = document.getElementById('emp').checked;
    let role = document.getElementById('empRole').value;
    questions = (isEmp && role === 'موظف اداري') ? adminQuestions : fieldQuestions;
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('quiz-page').classList.remove('hidden');
    loadQuestion();
  }

  function loadQuestion() {
    if (currentQ >= questions.length) { showResult(); return; }
    document.getElementById('questionText').innerText = questions[currentQ].q;
    let opts = document.getElementById('optionsList');
    opts.innerHTML = '';
    questions[currentQ].options.forEach((opt, index) => {
      let div = document.createElement('div');
      div.className = 'option';
      div.innerText = opt;
      div.onclick = () => { if(index === questions[currentQ].answer) score++; currentQ++; loadQuestion(); };
      opts.appendChild(div);
    });
  }

  function showResult() {
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    document.getElementById('resName').innerText = "المشارك: " + document.getElementById('userName').value;
    document.getElementById('resScore').innerText = "النتيجة: " + score + " من " + questions.length;
    document.getElementById('resultMsg').innerText = score >= 8 ? "🌟 رائع! أنت نموذج يُحتذى به في السلامة." : "⚠️ شكراً، تذكر أن الالتزام الدائم هو أساس السلامة.";
  }
</script>
</body>
</html>
