<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قياس ثقافة السلامة - السعودية للطاقة</title>
<style>
  :root {
    --primary-color: #0066ff; 
    --secondary-color: #00cc99; 
    --bg-color: #f4f7f6;
    --card-bg: #ffffff;
  }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; text-align: center; }
  .container { max-width: 650px; margin: auto; background: var(--card-bg); padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); margin-top: 40px; border-top: 5px solid var(--primary-color); }
  .logo { width: 220px; margin-bottom: 15px; } 
  h1 { color: var(--primary-color); font-size: 26px; margin-bottom: 5px;}
  .subtitle { color: #7f8c8d; margin-bottom: 30px; }
  
  /* مربع الرسالة الأزرق (بدلاً من الأحمر) */
  .msg-box { background: rgba(0, 102, 255, 0.05); color: var(--primary-color); padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; border: 1px solid rgba(0, 102, 255, 0.2); }

  .user-type-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; background: #ecf0f1; padding: 15px; border-radius: 8px; }
  .user-type-container label { font-weight: bold; cursor: pointer; color: var(--primary-color);}
  
  input[type="text"], input[type="number"], select { width: 85%; padding: 14px; margin: 10px 0; border: 1.5px solid #bdc3c7; border-radius: 8px; font-size: 16px; font-family: inherit; box-sizing: border-box; }
  input:focus, select:focus { border-color: var(--primary-color); outline: none; }
  
  button { background-color: var(--primary-color); color: white; border: none; padding: 14px 24px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; width: 85%; font-family: inherit; transition: 0.3s; }
  button:hover { background-color: #004ecc; transform: scale(1.02); }
  
  .hidden { display: none !important; }
  .option { display: block; background: #f8f9f9; padding: 18px; margin: 12px 0; border-radius: 8px; cursor: pointer; border: 2px solid #e5e8e8; text-align: right; font-size: 16px; font-weight: 500; }
  .option:hover { background: #eaeded; border-color: var(--primary-color); }
  .footer { margin-top: 40px; font-size: 13px; color: #95a5a6; }
</style>
</head>
<body>

<div class="container" id="login-page">
  <img src="logo.png" alt="شعار السعودية للطاقة" class="logo" onerror="this.style.display='none';">
  <h1>قواعد الحفاظ على الحياة</h1>
  <p class="subtitle">بوابة قياس ثقافة السلامة المهنية</p>
  
  <div class="user-type-container">
    <div><input type="radio" id="emp" name="userType" value="employee" checked onchange="toggleFields()"><label for="emp">🏢 موظف شركة</label></div>
    <div><input type="radio" id="cont" name="userType" value="contractor" onchange="toggleFields()"><label for="cont">👷 مقاول</label></div>
  </div>

  <select id="empRole">
    <option value="" disabled selected>اختر المسمى الوظيفي</option>
    <option value="مدير">مدير</option>
    <option value="رئيس قسم">رئيس قسم</option>
    <option value="موظف ميداني">موظف ميداني</option>
    <option value="موظف اداري">موظف إداري</option>
  </select>

  <input type="text" id="companyId" placeholder="الرقم الوظيفي">
  <input type="text" id="nationalId" class="hidden" placeholder="رقم الهوية / الإقامة">
  <input type="text" id="userName" placeholder="الاسم الرباعي">
  
  <button onclick="startApp()">ابدأ</button>
</div>

<div class="container hidden" id="quiz-page">
  <h2 id="questionText" style="text-align: right; margin-top: 25px; line-height: 1.5;"></h2>
  <div id="optionsList"></div>
</div>

<div class="container hidden" id="result-page">
  <h1 style="color: var(--secondary-color);">🏁 اكتمل قياس ثقافة السلامة</h1>
  <div class="msg-box" id="resultMsg"></div>
  <h3 style="color: #34495e;">الاسم: <span id="resName" style="color: var(--primary-color);"></span></h3>
  <h3 style="color: #34495e;">النتيجة: <span id="score" style="color: var(--primary-color);"></span> / <span id="totalQ"></span></h3>
  <button onclick="location.reload()">إعادة القياس 🔄</button>
</div>

<div class="footer">© تم تطوير المنصة بواسطة قسم السلامة المهنية (HSE)</div>

<script>
  const questions = [
    { q: "1. متى يُسمح لك بالبدء في عمل يتطلب تصريح عمل؟", options: ["عندما يخبرني المشرف شفهياً.", "عندما أحصل على تصريح معتمد وأفهم مخاطره.", "عندما أكون متأكداً شخصياً."], answer: 1 },
    { q: "2. ما هو الإجراء الأهم عند العمل في مكان مرتفع؟", options: ["الاعتماد على زميل لمراقبتي.", "العمل بسرعة.", "استخدام معدات الحماية (Harness) وربطها طوال العمل."], answer: 2 },
    { q: "3. قبل صيانة أي معدة، ما هو الإجراء الصحيح؟", options: ["عزل الطاقة وتأمينها (LOTO).", "إيقاف التشغيل فقط.", "إخبار المشغل."], answer: 0 },
    { q: "4. هل يُسمح بالدخول لمكان مغلق لإنقاذ زميل دون تصريح؟", options: ["نعم في حالات الطوارئ.", "لا، يجب الحصول على تصريح وتوفير مراقب.", "نعم، إذا كان المكان مضاءً."], answer: 1 },
    { q: "5. ماذا تفعل إذا احتجت تجاوز نظام أمان؟", options: ["لا أقوم بذلك إلا بتصريح خاص.", "أقوم بتعطيله مؤقتاً.", "أطلب موافقة شفهية."], answer: 0 },
    { q: "6. ما هي مخالفة القيادة الآمنة؟", options: ["فحص المركبة.", "ربط الحزام.", "استخدام الهاتف أو تجاوز السرعة."], answer: 2 },
    { q: "7. ما المقصود بـ 'خط النار'؟", options: ["الأماكن الحارة.", "مسار الأشياء المتحركة أو المتساقطة.", "المواد القابلة للاشتعال."], answer: 1 },
    { q: "8. قبل العمل الساخن، يجب التأكد من:", options: ["إبعاد المواد القابلة للاشتعال وتوفر طفاية.", "ارتداء نظارة شمسية.", "السرعة في الإنجاز."], answer: 0 },
    { q: "9. من يملك صلاحية إيقاف العمل غير الآمن؟", options: ["المدير فقط.", "مسؤول السلامة فقط.", "جميع الموظفين."], answer: 2 },
    { q: "10. عند اكتشاف تسرب كيميائي مجهول:", options: ["الابتعاد وإبلاغ الطوارئ.", "تنظيفه بالماء.", "تغطيته بالرمال."], answer: 0 }
  ];

  let currentQ = 0, score = 0;
  function toggleFields() {
    let isEmp = document.getElementById('emp').checked;
    document.getElementById('companyId').classList.toggle('hidden', !isEmp);
    document.getElementById('empRole').classList.toggle('hidden', !isEmp);
    document.getElementById('nationalId').classList.toggle('hidden', isEmp);
  }
  function startApp() {
    if(!document.getElementById('userName').value) return alert("الاسم مطلوب");
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('quiz-page').classList.remove('hidden');
    loadQuestion();
  }
  function loadQuestion() {
    if (currentQ >= questions.length) { showResult(); return; }
    document.getElementById('questionText').innerText = questions[currentQ].q;
    let opts = document.getElementById('optionsList');
    opts.innerHTML = '';
    questions[currentQ].options.forEach((opt, index) => {
      let div = document.createElement('div');
      div.className = 'option';
      div.innerText = opt;
      div.onclick = () => { if(index === questions[currentQ].answer) score++; currentQ++; loadQuestion(); };
      opts.appendChild(div);
    });
  }
  function showResult() {
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    document.getElementById('resName').innerText = document.getElementById('userName').value;
    document.getElementById('score').innerText = score;
    document.getElementById('totalQ').innerText = questions.length;
    document.getElementById('resultMsg').innerText = score >= 8 ? "🌟 رائع! أنت نموذج يُحتذى به في السلامة." : "⚠️ شكراً، تذكر أن الالتزام الدائم هو أساس السلامة.";
  }
</script>
</body>
</html>
