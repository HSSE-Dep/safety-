<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة السلامة - السعودية للطاقة</title>
<style>
  :root {
    --primary-color: #0066ff; /* أزرق السعودية للطاقة */
    --secondary-color: #00cc99; /* أخضر/سماوي السعودية للطاقة */
    --bg-color: #f4f7f6;
    --card-bg: #ffffff;
  }
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: var(--bg-color); 
    margin: 0; 
    padding: 20px; 
    text-align: center; 
  }
  .container { 
    max-width: 650px; 
    margin: auto; 
    background: var(--card-bg); 
    padding: 40px 30px; 
    border-radius: 12px; 
    box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
    margin-top: 40px; 
    border-top: 5px solid var(--primary-color);
  }
  .logo { width: 220px; margin-bottom: 15px; }
  h1 { color: var(--primary-color); font-size: 28px; margin-bottom: 5px;}
  h2 { color: #34495e; font-size: 20px;}
  p.subtitle { color: #7f8c8d; margin-bottom: 30px; }
  
  .user-type-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    background: #ecf0f1;
    padding: 15px;
    border-radius: 8px;
  }
  .user-type-container label { font-weight: bold; cursor: pointer; color: var(--primary-color);}
  
  input[type="text"], input[type="number"], select { 
    width: 85%; 
    padding: 14px; 
    margin: 10px 0; 
    border: 1.5px solid #bdc3c7; 
    border-radius: 8px; 
    font-size: 16px; 
    font-family: inherit;
    transition: 0.3s;
    box-sizing: border-box;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    border-color: var(--primary-color);
    outline: none;
  }
  
  button { 
    background-color: var(--primary-color); 
    color: white; 
    border: none; 
    padding: 14px 24px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 18px; 
    font-weight: bold;
    margin-top: 20px; 
    width: 85%;
    font-family: inherit;
    transition: 0.3s;
  }
  button:hover { background-color: #004ecc; transform: scale(1.02); }
  
  .hidden { display: none !important; }
  
  .question-box { margin: 20px 0; text-align: right; }
  .option { 
    display: block; 
    background: #f8f9f9; 
    padding: 18px; 
    margin: 12px 0; 
    border-radius: 8px; 
    cursor: pointer; 
    border: 2px solid #e5e8e8; 
    text-align: right; 
    font-size: 16px;
    font-weight: 500;
    transition: 0.2s;
  }
  .option:hover { background: #eaeded; border-color: var(--primary-color); }
  
  #timer { font-size: 28px; font-weight: bold; color: #e74c3c; direction: ltr; background: #fdf2e9; padding: 10px; border-radius: 8px; display: inline-block;}
  .footer { margin-top: 40px; font-size: 13px; color: #95a5a6; }
</style>
</head>
<body>

<div class="container" id="login-page">
  <!-- سيتم عرض الشعار هنا بمجرد رفعه -->
  <img src="logo.png" alt="السعودية للطاقة" class="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2622/2622834.png'; this.style.width='100px';">
  
  <h1>قواعد الحفاظ على الحياة</h1>
  <p class="subtitle">بوابة التقييم واختبار السلامة المهنية</p>
  
  <input type="text" id="userName" placeholder="الاسم الرباعي" required>
  
  <div class="user-type-container">
    <div>
      <input type="radio" id="emp" name="userType" value="employee" checked onchange="toggleFields()">
      <label for="emp">🏢 موظف شركة</label>
    </div>
    <div>
      <input type="radio" id="cont" name="userType" value="contractor" onchange="toggleFields()">
      <label for="cont">👷 مقاول</label>
    </div>
  </div>

  <select id="empRole">
    <option value="" disabled selected>اختر المسمى الوظيفي</option>
    <option value="مدير">مدير</option>
    <option value="رئيس قسم">رئيس قسم</option>
    <option value="موظف ميداني">موظف ميداني</option>
    <option value="موظف اداري">موظف إداري</option>
  </select>

  <input type="number" id="companyId" placeholder="الرقم الوظيفي" required>
  <input type="number" id="nationalId" class="hidden" placeholder="رقم الهوية / الإقامة" required>
  
  <button onclick="startApp()">ابدأ</button>
</div>

<div class="container hidden" id="quiz-page">
  <div id="timer">⏱️ 30</div>
  <h2 id="questionText" style="text-align: right; margin-top: 25px; line-height: 1.5;"></h2>
  <div id="optionsList"></div>
</div>

<div class="container hidden" id="result-page">
  <h1 style="color: var(--secondary-color);">🏁 اكتمل الاختبار</h1>
  <h3 style="color: #34495e;">الاسم: <span id="resName" style="color: var(--primary-color);"></span></h3>
  <h3 style="color: #34495e;">التصنيف: <span id="resType" style="color: var(--primary-color);"></span></h3>
  <h3 style="color: #34495e;">الرقم: <span id="resId" style="color: var(--primary-color);"></span></h3>
  <br>
  <h2 style="color: var(--secondary-color); font-size: 26px;">النتيجة: <span id="score"></span> / <span id="totalQ"></span></h2>
  <button onclick="location.reload()">إعادة الاختبار 🔄</button>
</div>

<div class="footer">© تم تطوير المنصة بواسطة قسم السلامة المهنية (HSE)</div>

<script>
  const questions = [
    { q: "1. متى يُسمح لك بالبدء في عمل يتطلب تصريح عمل (Work Permit)؟", options: ["عندما يخبرني المشرف شفهياً بالبدء.", "عندما أحصل على تصريح عمل معتمد وصالح وأفهم محتواه.", "عندما أكون متأكداً شخصياً من أن المكان آمن."], answer: 1 },
    { q: "2. ما هو الإجراء الأهم عند العمل في مكان مرتفع يحتاج إلى حماية من السقوط؟", options: ["الاعتماد على زميل لمراقبتي وتنبيهي.", "العمل بسرعة لتقليل وقت التواجد في المرتفعات.", "فحص واستخدام معدات الحماية من السقوط (Harness) وربطها طوال فترة العمل."], answer: 2 },
    { q: "3. قبل البدء في صيانة أو إصلاح أي معدة، ما هو الإجراء الصحيح للتعامل مع مصادر الطاقة؟", options: ["عزل الطاقة وتأمينها بالقفل واللوحة التحذيرية (LOTO) واختبار خلوها.", "إيقاف تشغيل المعدة من الزر الرئيسي فقط والبدء بالعمل.", "إخبار المشغل بإيقاف المعدة والوقوف بجانبها للحراسة."], answer: 0 },
    { q: "4. هل يُسمح لك بالدخول إلى مكان مغلق لإنقاذ زميل فاقد للوعي دون تصريح أو معدات مخصصة؟", options: ["نعم، في حالات الطوارئ القصوى فقط لإنقاذ حياته.", "لا، يجب الحصول على تصريح واختبار الغازات وتوفر مراقب (Hole Watch).", "نعم، إذا كان المكان مضاءً جيداً ودرجة الحرارة معتدلة."], answer: 1 },
    { q: "5. ماذا تفعل إذا احتجت إلى تجاوز نظام أمان (مثل حساس الحريق) لإنجاز عمل صيانة؟", options: ["لا أقوم بتجاوز أي نظام أمان إلا بتصريح تجاوز خاص ومعتمد.", "أقوم بتعطيله مؤقتاً بحذر وأعيده فور الانتهاء.", "أطلب من المشرف الموافقة الشفهية لإيقافه وأبدأ العمل."], answer: 0 },
    { q: "6. أي من السلوكيات التالية تعتبر مخالفة جسيمة لقواعد القيادة الآمنة؟", options: ["فحص المركبة والإطارات قبل بدء الرحلة.", "ربط حزام الأمان للسائق ولجميع الركاب.", "استخدام الهاتف المحمول أثناء القيادة أو تجاوز السرعة المحددة."], answer: 2 },
    { q: "7. ما المقصود بالقاعدة التحذيرية: ابق خارج خط النار (Line of Fire)؟", options: ["تجنب العمل في الأماكن ذات درجات الحرارة العالية.", "إبقاء الجسم بعيداً عن مسار الأشياء المتحركة أو المتساقطة أو مصادر الطاقة.", "عدم استخدام المواد القابلة للاشتعال بالقرب من الحرارة."], answer: 1 },
    { q: "8. قبل البدء في أعمال اللحام أو القطع (العمل الساخن)، يجب التأكد بشكل أساسي من:", options: ["إبعاد المواد القابلة للاشتعال وتوفر طفاية حريق ومراقب حريق.", "ارتداء النظارة الشمسية فقط والعمل في منطقة خارجية.", "إنجاز العمل في أسرع وقت لتقليل احتمالية حدوث شرر."], answer: 0 },
    { q: "9. من يملك الصلاحية لإيقاف أي عمل يعتبره غير آمن (Stop Work Authority)؟", options: ["مدير الموقع أو المهندس المسؤول فقط.", "مسؤول السلامة والصحة المهنية (HSE) فقط.", "جميع الموظفين والعمال والمقاولين لديهم الحق المطلق لإيقاف العمل."], answer: 2 },
    { q: "10. ما هو الإجراء الصحيح عند اكتشاف تسرب لمادة كيميائية غير معروفة؟", options: ["الابتعاد عن المكان فوراً، تحذير الآخرين، وإبلاغ الطوارئ.", "محاولة تنظيف التسرب باستخدام الماء والصابون.", "تغطية التسرب بالرمال ومواصلة العمل."], answer: 0 }
  ];

  let currentQ = 0, score = 0, timeLeft = 30, timer;
  let finalIdValue = "", userRoleText = "";

  function toggleFields() {
    let isEmp = document.getElementById('emp').checked;
    if (isEmp) {
      document.getElementById('companyId').classList.remove('hidden');
      document.getElementById('empRole').classList.remove('hidden');
      document.getElementById('nationalId').classList.add('hidden');
    } else {
      document.getElementById('companyId').classList.add('hidden');
      document.getElementById('empRole').classList.add('hidden');
      document.getElementById('nationalId').classList.remove('hidden');
    }
  }

  function startApp() {
    let name = document.getElementById('userName').value;
    let isEmp = document.getElementById('emp').checked;
    let compId = document.getElementById('companyId').value;
    let natId = document.getElementById('nationalId').value;
    let empRole = document.getElementById('empRole').value;

    if (name.trim() === '') {
      alert("⚠️ الرجاء إدخال الاسم الرباعي");
      return;
    }

    if (isEmp) {
      if (empRole === '') {
        alert("⚠️ الرجاء اختيار المسمى الوظيفي");
        return;
      }
      if (compId.trim() === '') {
        alert("⚠️ الرجاء إدخال الرقم الوظيفي");
        return;
      }
      finalIdValue = compId;
      userRoleText = "موظف شركة - " + empRole;
    } else {
      if (natId.trim() === '') {
        alert("⚠️ الرجاء إدخال رقم الهوية / الإقامة");
        return;
      }
      finalIdValue = natId;
      userRoleText = "مقاول";
    }

    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('quiz-page').classList.remove('hidden');
    loadQuestion();
    timer = setInterval(updateTimer, 1000);
  }

  function loadQuestion() {
    if (currentQ >= questions.length) { showResult(); return; }
    document.getElementById('questionText').innerText = questions[currentQ].q;
    let opts = document.getElementById('optionsList');
    opts.innerHTML = '';
    questions[currentQ].options.forEach((opt, index) => {
      let div = document.createElement('div');
      div.className = 'option';
      div.innerText = opt;
      div.onclick = () => checkAnswer(index);
      opts.appendChild(div);
    });
    timeLeft = 30; 
  }

  function updateTimer() {
    timeLeft--;
    document.getElementById('timer').innerText = "⏱️ " + timeLeft;
    if (timeLeft <= 0) {
      currentQ++;
      loadQuestion();
    }
  }

  function checkAnswer(index) {
    if (index === questions[currentQ].answer) score++;
    currentQ++;
    loadQuestion();
  }

  function showResult() {
    clearInterval(timer);
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    
    document.getElementById('resName').innerText = document.getElementById('userName').value;
    document.getElementById('resType').innerText = userRoleText;
    document.getElementById('resId').innerText = finalIdValue;
    document.getElementById('score').innerText = score;
    document.getElementById('totalQ').innerText = questions.length;
  }
</script>
</body>
</html>
